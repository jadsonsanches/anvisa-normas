name: Atualização Contínua das Normas da Anvisa

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  atualizar-acervo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Pipeline de Coleta e Grafo
        run: node scripts/pipeline.js

      - name: Commitar e Publicar Alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhuma norma nova ou alterada encontrada."
          else
            git commit -m "chore(dados): atualização automática do acervo e grafo [skip ci]"
            git push
          fi
